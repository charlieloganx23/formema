<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste Hash SHA-256</title>
    <style>
        body {
            font-family: monospace;
            padding: 2rem;
            background: #f5f5f5;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        input {
            width: 100%;
            padding: 0.8rem;
            margin: 0.5rem 0;
            border: 2px solid #ddd;
            border-radius: 4px;
            font-size: 1rem;
        }
        button {
            background: #2e7d32;
            color: white;
            border: none;
            padding: 0.8rem 1.5rem;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1rem;
            margin-top: 1rem;
        }
        button:hover {
            background: #1b5e20;
        }
        .result {
            margin-top: 1rem;
            padding: 1rem;
            background: #f9f9f9;
            border-left: 4px solid #2e7d32;
            word-break: break-all;
        }
        .expected {
            margin-top: 1rem;
            padding: 1rem;
            background: #e3f2fd;
            border-left: 4px solid #1976d2;
        }
        .match {
            color: green;
            font-weight: bold;
        }
        .no-match {
            color: red;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔐 Teste de Hash SHA-256</h1>
        <p>Digite uma senha para gerar o hash e comparar com o banco de dados:</p>
        
        <input type="text" id="senha" placeholder="Digite a senha" value="senha123">
        <button onclick="gerarHash()">Gerar Hash</button>
        
        <div id="resultado"></div>
        
        <div class="expected">
            <h3>📋 Hashes Esperados (do banco):</h3>
            <p><strong>senha123:</strong><br>8d969eef6ecad3c29a3a629280e686cf0c3f5d5a86aff3ca12020c923adc6c92</p>
            <p><strong>admin123:</strong><br>240be518fabd2724ddb6f04eeb1da5967448d7e831c08c8fa822809f74c720a9</p>
        </div>
    </div>

    <script>
        async function hashPassword(password) {
            const msgBuffer = new TextEncoder().encode(password);
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
            return hashHex;
        }

        async function gerarHash() {
            const senha = document.getElementById('senha').value;
            const hash = await hashPassword(senha);
            
            const hashes = {
                'senha123': '8d969eef6ecad3c29a3a629280e686cf0c3f5d5a86aff3ca12020c923adc6c92',
                'admin123': '240be518fabd2724ddb6f04eeb1da5967448d7e831c08c8fa822809f74c720a9'
            };
            
            const esperado = hashes[senha];
            let match = '';
            
            if (esperado) {
                if (hash === esperado) {
                    match = `<p class="match">✅ HASH CORRETO! Bate com o banco de dados.</p>`;
                } else {
                    match = `<p class="no-match">❌ HASH DIFERENTE! NÃO bate com o esperado.</p>
                             <p>Esperado: ${esperado}</p>`;
                }
            }
            
            document.getElementById('resultado').innerHTML = `
                <div class="result">
                    <h3>Hash gerado:</h3>
                    <p>${hash}</p>
                    ${match}
                </div>
            `;
        }

        // Gerar automaticamente ao carregar
        window.onload = () => gerarHash();
    </script>
</body>
</html>
