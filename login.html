<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistema Formema | Emater-RO</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔐</text></svg>">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            background: white;
            border-radius: 20px;
            max-width: 450px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            animation: slideUp 0.5s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-header {
            background: linear-gradient(135deg, #2e7d32 0%, #388e3c 100%);
            color: white;
            padding: 50px 30px;
            text-align: center;
        }

        .login-header h1 {
            font-size: 2em;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .login-header p {
            opacity: 0.95;
            font-size: 1.1em;
        }

        .login-body {
            padding: 40px 30px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 0.95em;
        }

        .form-group input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1em;
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: #2e7d32;
            box-shadow: 0 0 0 3px rgba(46, 125, 50, 0.1);
        }

        .btn-login {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #2e7d32 0%, #388e3c 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(46, 125, 50, 0.4);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .btn-login:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .alert {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
            animation: slideDown 0.3s ease-out;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .alert.show {
            display: block;
        }

        .alert-error {
            background: #ffebee;
            color: #c62828;
            border-left: 4px solid #c62828;
        }

        .alert-info {
            background: #e3f2fd;
            color: #1565c0;
            border-left: 4px solid #1565c0;
        }

        .login-footer {
            text-align: center;
            padding: 20px;
            background: #f5f5f5;
            color: #666;
            font-size: 0.9em;
        }

        .version {
            margin-top: 10px;
            font-size: 0.85em;
            opacity: 0.7;
        }

        .loading-spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.6s linear infinite;
            margin-right: 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 480px) {
            .login-header h1 {
                font-size: 1.6em;
            }
            
            .login-body {
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h1 id="titulo-formulario">🏢 Sistema Formema</h1>
            <p id="subtitulo-formulario">Emater-RO - Autenticação de Usuário</p>
        </div>

        <div class="login-body">
            <div id="alert-container"></div>

            <form id="login-form">
                <div class="form-group">
                    <label for="usuario">👤 Usuário</label>
                    <input 
                        type="text" 
                        id="usuario" 
                        name="usuario" 
                        placeholder="Digite seu usuário"
                        required
                        autofocus
                        autocomplete="username"
                    >
                </div>

                <div class="form-group">
                    <label for="senha">🔒 Senha</label>
                    <input 
                        type="password" 
                        id="senha" 
                        name="senha" 
                        placeholder="Digite sua senha"
                        required
                        autocomplete="current-password"
                    >
                </div>

                <button type="submit" class="btn-login" id="btn-submit">
                    Entrar
                </button>
            </form>
        </div>

        <div class="login-footer">
            <strong>Emater-RO</strong> - Empresa de Assistência Técnica e Extensão Rural<br>
            <div class="version">v2.1 - Sistema de Formulários de Avaliação</div>
        </div>
    </div>

    <script>
        // ========== LER PARÂMETRO TIPO DA URL ==========
        const urlParams = new URLSearchParams(window.location.search);
        const tipoFormulario = urlParams.get('tipo') || 'extensionista';

        // ========== ATUALIZAR TÍTULO BASEADO NO TIPO ==========
        const titulos = {
            'extensionista': {
                icon: '🌾',
                titulo: 'Formulário Extensionistas',
                subtitulo: 'Acesso para Técnicos de Campo e Extensão Rural'
            },
            'gerente': {
                icon: '👔',
                titulo: 'Formulário Gerentes',
                subtitulo: 'Acesso para Gestores e Coordenadores de Escritórios'
            },
            'admin': {
                icon: '⚙️',
                titulo: 'Painel Administrativo',
                subtitulo: 'Acesso Exclusivo para Administradores do Sistema'
            }
        };

        const config = titulos[tipoFormulario] || titulos['extensionista'];
        document.getElementById('titulo-formulario').innerHTML = `${config.icon} ${config.titulo}`;
        document.getElementById('subtitulo-formulario').textContent = config.subtitulo;

        // ========== FUNÇÕES AUXILIARES ==========
        
        function showAlert(message, type = 'error') {
            const container = document.getElementById('alert-container');
            const alertClass = type === 'error' ? 'alert-error' : 'alert-info';
            container.innerHTML = `
                <div class="alert ${alertClass} show">
                    ${type === 'error' ? '❌' : 'ℹ️'} ${message}
                </div>
            `;
        }

        function clearAlert() {
            document.getElementById('alert-container').innerHTML = '';
        }

        // Hash SHA256 da senha (cliente)
        async function hashPassword(password) {
            const msgBuffer = new TextEncoder().encode(password);
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
            return hashHex;
        }

        // ========== VERIFICAR SE JÁ ESTÁ LOGADO ==========
        
        const usuarioLogado = localStorage.getItem('formema_usuario');
        if (usuarioLogado) {
            try {
                const user = JSON.parse(usuarioLogado);
                
                // Verificar se sessão ainda é válida (7 dias)
                const dataLogin = new Date(user.dataLogin);
                const diasDesdeLogin = (Date.now() - dataLogin.getTime()) / (1000 * 60 * 60 * 24);
                
                if (diasDesdeLogin <= 7) {
                    // Redirecionar baseado no perfil
                    showAlert('Redirecionando...', 'info');
                    setTimeout(() => {
                        if (user.perfil === 'admin') {
                            window.location.href = 'admin.html';
                        } else if (user.perfil === 'extensionista') {
                            window.location.href = 'extensionistas.html';
                        } else if (user.perfil === 'gerente') {
                            window.location.href = 'gerentes.html';
                        }
                    }, 500);
                } else {
                    // Sessão expirada
                    localStorage.removeItem('formema_usuario');
                    showAlert('Sua sessão expirou. Por favor, faça login novamente.', 'info');
                }
            } catch (e) {
                localStorage.removeItem('formema_usuario');
            }
        }

        // ========== PROCESSAR LOGIN ==========
        
        document.getElementById('login-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            clearAlert();

            const usuario = document.getElementById('usuario').value.trim();
            const senha = document.getElementById('senha').value;
            const btnSubmit = document.getElementById('btn-submit');

            // Validação básica
            if (!usuario || !senha) {
                showAlert('Por favor, preencha todos os campos.');
                return;
            }

            // Desabilitar botão e mostrar loading
            btnSubmit.disabled = true;
            btnSubmit.innerHTML = '<span class="loading-spinner"></span>Autenticando...';

            try {
                // Gerar hash SHA-256 da senha
                const senhaHash = await hashPassword(senha);

                // Fazer requisição de login
                const response = await fetch('/.netlify/functions/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        usuario: usuario,
                        senha: senhaHash
                    })
                });

                const data = await response.json();

                if (data.sucesso) {
                    // Salvar dados do usuário no localStorage
                    localStorage.setItem('formema_usuario', JSON.stringify({
                        id: data.usuario.id,
                        usuario: data.usuario.usuario,
                        nome: data.usuario.nome_completo,
                        perfil: data.usuario.perfil,
                        municipio: data.usuario.municipio,
                        escritorioLocal: data.usuario.escritorio_local,
                        token: data.token,
                        dataLogin: new Date().toISOString()
                    }));

                    showAlert('Login realizado com sucesso! Redirecionando...', 'info');

                    // Validar permissão e redirecionar
                    setTimeout(() => {
                        const perfil = data.usuario.perfil;
                        let destino = '';
                        let erro = false;

                        // REGRAS DE REDIRECIONAMENTO:
                        if (tipoFormulario === 'extensionista') {
                            if (perfil === 'extensionista' || perfil === 'admin') {
                                destino = 'extensionistas.html';
                            } else {
                                erro = true;
                                showAlert('❌ Acesso negado! Você não tem permissão para acessar o formulário de extensionistas.');
                            }
                        } 
                        else if (tipoFormulario === 'gerente') {
                            if (perfil === 'gerente' || perfil === 'admin') {
                                destino = 'gerentes.html';
                            } else {
                                erro = true;
                                showAlert('❌ Acesso negado! Você não tem permissão para acessar o formulário de gerentes.');
                            }
                        }
                        else if (tipoFormulario === 'admin') {
                            if (perfil === 'admin') {
                                destino = 'admin.html';
                            } else {
                                erro = true;
                                showAlert('❌ Acesso negado! Apenas administradores podem acessar o painel administrativo.');
                            }
                        }

                        if (!erro && destino) {
                            window.location.href = destino;
                        } else if (!erro) {
                            // Fallback caso tipo não seja reconhecido
                            switch (perfil) {
                                case 'extensionista':
                                    window.location.href = 'extensionistas.html';
                                    break;
                                case 'gerente':
                                    window.location.href = 'gerentes.html';
                                    break;
                                case 'admin':
                                    window.location.href = 'admin.html';
                                    break;
                                default:
                                    showAlert('Perfil de usuário não reconhecido.');
                            }
                        } else {
                            // Houve erro de permissão, reabilitar botão
                            btnSubmit.disabled = false;
                            btnSubmit.textContent = 'Entrar';
                            localStorage.removeItem('formema_usuario');
                        }
                    }, 800);

                } else {
                    showAlert(data.mensagem || 'Usuário ou senha inválidos.');
                    btnSubmit.disabled = false;
                    btnSubmit.textContent = 'Entrar';
                    document.getElementById('senha').value = '';
                    document.getElementById('senha').focus();
                }

            } catch (error) {
                console.error('❌ Erro no login:', error);
                showAlert('Erro ao conectar com o servidor. Verifique sua conexão.');
                btnSubmit.disabled = false;
                btnSubmit.textContent = 'Entrar';
            }
        });

        // ========== DETECTAR ENTER NOS CAMPOS ==========
        
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    document.getElementById('login-form').dispatchEvent(new Event('submit'));
                }
            });
        });
    </script>
</body>
</html>
